<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kronykar</title>
  <meta
    name="description"
    content="Oficjalna strona uniwersum Kronykar."
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <style>
    :root {
      --background: #0d0b09;
      --background-soft: #15110d;
      --text: #f3eee6;
      --muted: #a89d90;
      --accent: #b99256;
      --accent-soft: #7b623d;
      --border: rgba(185, 146, 86, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(185, 146, 86, 0.08), transparent 34%),
        linear-gradient(180deg, var(--background-soft), var(--background));
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(100%, 1100px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 64px 28px 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero {
      text-align: center;
    }

    .brand {
      margin: 0;
      font-size: clamp(54px, 9vw, 104px);
      line-height: 0.95;
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    .subtitle {
      margin: 22px 0 0;
      color: var(--accent);
      font-size: clamp(16px, 2vw, 20px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .intro {
      max-width: 680px;
      margin: 22px auto 0;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 20px);
      line-height: 1.7;
    }

    .divider {
      width: 84px;
      height: 1px;
      margin: 38px auto;
      background: var(--accent-soft);
      opacity: 0.8;
    }

    .project {
      text-align: center;
    }

    .project-title {
      margin: 0;
      font-size: clamp(26px, 4vw, 40px);
      font-weight: 600;
    }

    .project-status {
      margin: 12px 0 0;
      color: var(--accent);
      font-size: 14px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .socials {
      margin-top: 48px;
      text-align: center;
    }

    .socials-title {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .social-row {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .social-row.primary {
      gap: 16px;
    }

    .social-row.secondary {
      margin-top: 20px;
      gap: 12px;
    }

    .social-row.tertiary {
      margin-top: 15px;
      gap: 8px;
    }

    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      transition:
        transform 0.18s ease,
        border-color 0.18s ease,
        color 0.18s ease,
        background 0.18s ease;
    }

    .social-link:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(185, 146, 86, 0.06);
    }

    .primary .social-link {
      width: 58px;
      height: 58px;
      border-radius: 15px;
      font-size: 25px;
    }

    .secondary .social-link {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      color: #d4cbc0;
      font-size: 20px;
    }

    .tertiary .social-link {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border-color: rgba(185, 146, 86, 0.12);
      color: #8f867b;
      font-size: 16px;
    }

    footer {
      margin-top: 52px;
      padding-top: 22px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      color: #746c63;
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .page {
        padding: 48px 20px 24px;
      }

      .primary .social-link {
        width: 52px;
        height: 52px;
        font-size: 22px;
      }

      .social-row.primary {
        gap: 12px;
      }

      .divider {
        margin: 32px auto;
      }

      .socials {
        margin-top: 40px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <section class="hero">
      <h1 class="brand">KRONYKAR</h1>

      <p class="subtitle">
        Oficjalna strona uniwersum Kronykar
      </p>

      <p class="intro">
        Świat opowieści, bohaterów i wypraw.
        Kronykar dopiero rozpoczyna swoją historię.
      </p>
    </section>

    <div class="divider"></div>

    <section class="project">
      <h2 class="project-title">
        Kronykar: Ekspedycje
      </h2>

      <p class="project-status">
        W produkcji
      </p>
    </section>

    <section class="socials">
      <p class="socials-title">
        Znajdź Kronykar
      </p>

      <div class="social-row primary">

        <a
          class="social-link"
          href="https://youtube.com/@Kronykar"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="YouTube"
          title="YouTube"
        >
          <i class="fa-brands fa-youtube"></i>
        </a>

        <a
          class="social-link"
          href="https://tiktok.com/@kronykar"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="TikTok"
          title="TikTok"
        >
          <i class="fa-brands fa-tiktok"></i>
        </a>

        <a
          class="social-link"
          href="https://instagram.com/kronykaruniverse"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Instagram"
          title="Instagram"
        >
          <i class="fa-brands fa-instagram"></i>
        </a>

        <a
          class="social-link"
          href="https://facebook.com/Kronykar"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Facebook"
          title="Facebook"
        >
          <i class="fa-brands fa-facebook-f"></i>
        </a>

        <a
          class="social-link"
          href="https://x.com/Kronykar"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="X"
          title="X"
        >
          <i class="fa-brands fa-x-twitter"></i>
        </a>

        <a
          class="social-link"
          href="https://twitch.tv/kronykar"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Twitch"
          title="Twitch"
        >
          <i class="fa-brands fa-twitch"></i>
        </a>

      </div>

      <div class="social-row secondary">

        <a
          class="social-link"
          href="https://reddit.com/u/Kronykar"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Reddit"
          title="Reddit"
        >
          <i class="fa-brands fa-reddit-alien"></i>
        </a>

        <a
          class="social-link"
          href="https://threads.com/@kronykaruniverse"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Threads"
          title="Threads"
        >
          <i class="fa-brands fa-threads"></i>
        </a>

        <a
          class="social-link"
          href="https://bsky.app/profile/kronykar.bsky.social"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Bluesky"
          title="Bluesky"
        >
          <i class="fa-brands fa-bluesky"></i>
        </a>

        <a
          class="social-link"
          href="https://kick.com/kronykar"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Kick"
          title="Kick"
        >
          <i class="fa-solid fa-play"></i>
        </a>

        <a
          class="social-link"
          href="https://kronykar.itch.io"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="itch.io"
          title="itch.io"
        >
          <i class="fa-brands fa-itch-io"></i>
        </a>

      </div>

      <div class="social-row tertiary">

        <a
          class="social-link"
          href="https://patreon.com/Kronykar"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Patreon"
          title="Patreon"
        >
          <i class="fa-brands fa-patreon"></i>
        </a>

        <a
          class="social-link"
          href="https://soundcloud.com/kronykar"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="SoundCloud"
          title="SoundCloud"
        >
          <i class="fa-brands fa-soundcloud"></i>
        </a>

        <a
          class="social-link"
          href="https://github.com/Kronykar"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub"
          title="GitHub"
        >
          <i class="fa-brands fa-github"></i>
        </a>

      </div>
    </section>

    <footer>
      © 2026 Avard Games · Kronykar
    </footer>

  </main>
</body>
</html>
